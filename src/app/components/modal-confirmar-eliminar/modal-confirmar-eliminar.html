<mat-dialog-content class="contenido-confirmacion">
  <p>¿Está seguro de eliminar el usuario seleccionado?</p>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    class="btn-aceptar"
    type="button"
    (click)="confirmar()">
    Aceptar
  </button>

  <button
    class="btn-cancelar"
    type="button"
    (click)="cancelar()">
    Cancelar
  </button>
</mat-dialog-actions>
